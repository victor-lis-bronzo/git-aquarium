name: Generate Aquarium SVG

on:
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username
        required: true
        default: victor-lis-bronzo
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Render aquarium.svg
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AQUARIUM_USERNAME: ${{ inputs.username || github.repository_owner }}
          AQUARIUM_OUTPUT: aquarium.svg
        run: npm run generate -- --output aquarium.svg
      - name: Commit updated SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add aquarium.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update aquarium.svg"
          git push
