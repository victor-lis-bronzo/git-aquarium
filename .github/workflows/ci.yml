name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run generate:mock:thriving
      - run: npm run generate:mock:dormant
      - uses: actions/upload-artifact@v4
        with:
          name: aquarium-previews
          path: assets/preview-*.svg
