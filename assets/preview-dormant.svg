<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Amazonian Blackwater Biotope Aquarium for dormant-user">
  
  <defs>
    <linearGradient id="bgWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2a1f" />
      <stop offset="40%" stop-color="#2b2016" />
      <stop offset="100%" stop-color="#1a130c" />
    </linearGradient>
    <radialGradient id="tanninVignette" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="rgba(118,78,34,0.228)" />
      <stop offset="100%" stop-color="rgba(20,12,6,0.780)" />
    </radialGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,218,156,0.082)" />
      <stop offset="100%" stop-color="rgba(255,218,156,0)" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="cardinalTetra">
      <ellipse cx="0" cy="0" rx="22" ry="8" fill="#c83737" />
      <rect x="-22" y="-5" width="44" height="4" rx="2" fill="#39a7ff" />
      <polygon points="22,0 30,-5 30,5" fill="#d24848" />
    </g>
    <g id="angelfish">
      <ellipse cx="0" cy="2" rx="12" ry="17" fill="#d8d2c6" />
      <polygon points="0,-26 -7,-9 7,-9" fill="#e9e4da" />
      <polygon points="0,26 -6,10 6,10" fill="#e9e4da" />
      <rect x="-10" y="-5" width="20" height="2" fill="#67604d" opacity="0.45"/>
    </g>
    <g id="corydoras">
      <ellipse cx="0" cy="0" rx="16" ry="6" fill="#8a7a5f" />
      <polygon points="16,0 24,-4 24,4" fill="#77684f" />
      <line x1="-14" y1="0" x2="-22" y2="4" stroke="#b8a780" stroke-width="1" />
      <line x1="-14" y1="0" x2="-22" y2="-4" stroke="#b8a780" stroke-width="1" />
    </g>
  </defs>
  
  <style>
    .caustic { animation: drift 14s linear infinite; }
    .fish { animation: swim calc(var(--dur) * 1s) ease-in-out infinite; animation-delay: calc(var(--delay) * 1s); }
    .plant { transform-box: fill-box; transform-origin: bottom center; animation: sway calc(var(--sway) * 1s) ease-in-out infinite alternate; animation-delay: calc(var(--sdelay) * 1s); }
    .bubble { animation: rise calc(var(--rise) * 1s) linear infinite; }
    .nutrient { animation: sink calc(var(--sink) * 1s) linear infinite; }
    @keyframes swim { 0%,100% { transform: translate(0,0); } 50% { transform: translate(calc(var(--dx) * 1px), calc(var(--dy) * 1px)); } }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes rise { from { transform: translateY(0); opacity: 0.1; } to { transform: translateY(-220px); opacity: 0.9; } }
    @keyframes sink { from { transform: translateY(0); opacity: 0.9; } to { transform: translateY(190px); opacity: 0.2; } }
    @keyframes drift { from { transform: translateX(-18px); } to { transform: translateX(18px); } }
  </style>
  
  <g id="background">
    <rect width="960" height="320" fill="url(#bgWater)"/>
    <polygon class="caustic" points="70,0 110,0 82,272 58,272" fill="url(#sunbeam)" opacity="0.16"/><polygon class="caustic" points="230,0 280,0 245,272 215,272" fill="url(#sunbeam)" opacity="0.16"/><polygon class="caustic" points="390,0 450,0 408,272 372,272" fill="url(#sunbeam)" opacity="0.16"/><polygon class="caustic" points="550,0 620,0 571,272 529,272" fill="url(#sunbeam)" opacity="0.16"/><polygon class="caustic" points="710,0 790,0 734,272 686,272" fill="url(#sunbeam)" opacity="0.16"/>
